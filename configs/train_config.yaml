# Model
model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  max_seq_length: 512

# QLoRA
qlora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
  bits: 4

# Training
training:
  output_dir: "checkpoints/model1"
  num_train_epochs: 3
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  warmup_steps: 100
  weight_decay: 0.01
  fp16: false
  bf16: true
  logging_steps: 50
  eval_steps: 500
  save_steps: 500
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"

# Data
data:
  hf_dataset: "delpgiero/customs-model1"

# HuggingFace Hub
hub:
  push_to_hub: true
  hub_model_id: "delpgiero/customs-classifier-model1"
